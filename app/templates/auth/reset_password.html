{% extends "base.html" %}
{% block title %}Set New Password — LappyShare{% endblock %}

{% block content %}
<div class="container" style="padding: 4rem 1.25rem; max-width: 480px;">
  <div class="card" style="box-shadow: var(--shadow-lg);">
    <div class="card-header" style="text-align: center; display: block; padding: 2rem 2rem 1.25rem;">
      <div style="width: 50px; height: 50px; border-radius: 50%; background: var(--success-bg); color: var(--success); display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem;">
        <i data-lucide="shield-check" style="width: 24px; height: 24px;"></i>
      </div>
      <h2 style="font-size: 1.6rem; font-weight: 800; color: var(--primary);">Set New Password</h2>
      <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.25rem;">
        Choose a secure new password for your account
      </p>
    </div>

    <div class="card-body" style="padding: 1.5rem 2rem 2rem;">
      <form action="{{ url_for('auth.reset_password', token=token) }}" method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="form-group">
          <label class="form-label">New Password *</label>
          <input type="password" name="password" class="form-control" placeholder="Min 6 characters" required autofocus>
        </div>

        <div class="form-group">
          <label class="form-label">Confirm New Password *</label>
          <input type="password" name="confirm_password" class="form-control" placeholder="Repeat new password" required>
        </div>

        <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 0.5rem;">
          Update Password & Sign In
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
