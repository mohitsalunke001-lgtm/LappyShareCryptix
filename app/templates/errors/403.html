{% extends "base.html" %}
{% block title %}Access Denied — 403{% endblock %}

{% block content %}
<div class="container" style="padding: 5rem 1.25rem; text-align: center; max-width: 540px;">
  <div style="font-size: 5rem; font-weight: 800; color: var(--error); line-height: 1;">403</div>
  <h2 style="font-size: 1.75rem; color: var(--primary); margin: 1rem 0 0.5rem; font-weight: 700;">Access Denied</h2>
  <p style="color: var(--text-muted); margin-bottom: 2rem;">
    You do not have permission to view this resource. Contact the campus administrator if you believe this is an error.
  </p>
  <a href="{{ url_for('main.index') }}" class="btn btn-primary btn-lg">Return to Homepage</a>
</div>
{% endblock %}
