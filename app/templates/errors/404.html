{% extends "base.html" %}
{% block title %}Page Not Found — 404{% endblock %}

{% block content %}
<div class="container" style="padding: 5rem 1.25rem; text-align: center; max-width: 540px;">
  <div style="font-size: 5rem; font-weight: 800; color: var(--primary); line-height: 1;">404</div>
  <h2 style="font-size: 1.75rem; color: var(--primary); margin: 1rem 0 0.5rem; font-weight: 700;">Page Not Found</h2>
  <p style="color: var(--text-muted); margin-bottom: 2rem;">
    The requested page could not be located. It might have been moved or does not exist.
  </p>
  <a href="{{ url_for('main.index') }}" class="btn btn-primary btn-lg">Return to Homepage</a>
</div>
{% endblock %}
