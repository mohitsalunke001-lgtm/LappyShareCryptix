{% extends "base.html" %}
{% block title %}Server Error — 500{% endblock %}

{% block content %}
<div class="container" style="padding: 5rem 1.25rem; text-align: center; max-width: 540px;">
  <div style="font-size: 5rem; font-weight: 800; color: var(--error); line-height: 1;">500</div>
  <h2 style="font-size: 1.75rem; color: var(--primary); margin: 1rem 0 0.5rem; font-weight: 700;">Internal Server Error</h2>
  <p style="color: var(--text-muted); margin-bottom: 2rem;">
    Something unexpected occurred on our end. Our technical team has been notified.
  </p>
  <a href="{{ url_for('main.index') }}" class="btn btn-primary btn-lg">Return to Homepage</a>
</div>
{% endblock %}
