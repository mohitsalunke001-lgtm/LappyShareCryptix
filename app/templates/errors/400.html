{% extends "base.html" %}
{% block title %}Bad Request — 400{% endblock %}

{% block content %}
<div class="container" style="padding: 5rem 1.25rem; text-align: center; max-width: 540px;">
  <div style="font-size: 5rem; font-weight: 800; color: var(--warning); line-height: 1;">400</div>
  <h2 style="font-size: 1.75rem; color: var(--primary); margin: 1rem 0 0.5rem; font-weight: 700;">Bad Request</h2>
  <p style="color: var(--text-muted); margin-bottom: 2rem;">
    {{ description or "The server could not understand your request. Please try again." }}
  </p>
  <a href="{{ url_for('main.index') }}" class="btn btn-primary btn-lg">Return to Homepage</a>
</div>
{% endblock %}
